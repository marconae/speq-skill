[graph]
# Exclude dev-dependencies from checks (not distributed with CLI)
exclude-dev = true

[advisories]
ignore = []

# Allow list
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]

# Deny list
[bans]
deny = [
    { crate = "ring" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "openssl-probe" },
    { crate = "native-tls" },
    { crate = "boring" },
    { crate = "boring-sys" },
]

