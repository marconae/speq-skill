[graph]
# Exclude dev-dependencies from checks (not distributed with CLI)
exclude-dev = true

[advisories]
ignore = [
    # Unmaintained crates (not security vulnerabilities)
    "RUSTSEC-2024-0436",  # paste - transitive dep, no security impact
    "RUSTSEC-2023-0089",  # atomic-polyfill - transitive via postcard/heapless, no security impact
    # Build-time only dep; speq does not parse RFC 2822 user input; cannot upgrade (pinned by tract-linalg's liquid build dep)
    "RUSTSEC-2026-0009",  # time - stack exhaustion via RFC 2822 parsing; build-only transitive via tract-linalg → liquid
]

# Allow list
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]

[[licenses.clarify]]
# r-efi declares MIT OR Apache-2.0 OR LGPL-2.1-or-later; MIT satisfies the check
name = "r-efi"
expression = "MIT OR Apache-2.0 OR LGPL-2.1-or-later"
license-files = []

# Deny list
[bans]
deny = [
    { crate = "ring" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "openssl-probe" },
    { crate = "native-tls" },
    { crate = "boring" },
    { crate = "boring-sys" },
]

