[package]
name = "speq-skill"
version = "0.28.0"
edition = "2024"
authors = ["marconae"]
license = "MIT"
description = "Spec-driven development CLI for AI coding agents"
repository = "https://github.com/marconae/speq-skill"
readme = "README.md"
keywords = ["spec", "tdd", "codex", "claude", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "speq"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
pulldown-cmark = "0.13"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
